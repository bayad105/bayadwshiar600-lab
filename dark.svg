<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title description">
  <title id="title">Bayad — Software Engineering Student</title>
  <desc id="description">Profile banner for Bayad.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080f1c" />
      <stop offset="0.55" stop-color="#111a2b" />
      <stop offset="1" stop-color="#0b1423" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#152238" stop-opacity="0.96" />
      <stop offset="1" stop-color="#101a2a" stop-opacity="0.92" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57e2d1" />
      <stop offset="1" stop-color="#8d9cff" />
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#57e2d1" stop-opacity="0.22" />
      <stop offset="1" stop-color="#57e2d1" stop-opacity="0" />
      <animate attributeName="opacity" values="0.55;0.9;0.55" dur="8s" repeatCount="indefinite" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8aa0ba" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#80a1bd" fill-opacity="0.42" />
    </pattern>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #9cafc5; }
      .bright { fill: #f0f5fb; }
      .accent-text { fill: #72e5d6; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 2px; }
      .value { font-size: 19px; font-weight: 600; }
      .desktop { display: inline; }
      .mobile { display: none; }
      @media (max-width: 680px) {
        .desktop { display: none; }
        .mobile { display: inline; }
      }
    </style>
  </defs>

  <rect width="1180" height="610" rx="26" fill="url(#background)" />
  <rect x="14" y="14" width="1152" height="582" rx="22" fill="url(#grid)" />
  <circle cx="1060" cy="95" r="175" fill="url(#halo)" />
  <rect x="14" y="14" width="1152" height="582" rx="22" fill="none" stroke="#40516a" stroke-opacity="0.8" />
  <rect x="15" y="15" width="1150" height="52" rx="21" fill="#111b2c" fill-opacity="0.88" />
  <path d="M15 66H1165" stroke="#34465d" stroke-opacity="0.7" />

  <circle cx="42" cy="41" r="6" fill="#ff6b6b" />
  <circle cx="64" cy="41" r="6" fill="#f6c85f" />
  <circle cx="86" cy="41" r="6" fill="#54d6a1" />
  <text x="108" y="46" class="muted" font-size="14">bayad105 / profile</text>
  <text x="946" y="45" class="muted" font-size="12" letter-spacing="1.4">README.MD</text>

  <g class="desktop">
  <rect x="32" y="84" width="420" height="492" rx="18" fill="url(#panel)" stroke="#31445b" />
  <rect x="475" y="84" width="673" height="492" rx="18" fill="url(#panel)" stroke="#31445b" />
  <rect x="33" y="85" width="418" height="490" rx="17" fill="url(#dots)" opacity="0.16" />

  <text x="60" y="124" class="accent-text label">ABOUT ME</text>
  <text x="386" y="124" class="muted" font-size="12" text-anchor="end">01 / 02</text>
  <circle cx="242" cy="259" r="102" fill="url(#halo)" />
  <circle cx="242" cy="259" r="72" fill="#12243a" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.78">
    <animate attributeName="stroke-opacity" values="0.55;0.95;0.55" dur="7s" repeatCount="indefinite" />
  </circle>
  <circle cx="242" cy="259" r="60" fill="none" stroke="#84a0bd" stroke-opacity="0.2" stroke-dasharray="2 8" />
  <text x="242" y="286" text-anchor="middle" class="sans accent-text" font-size="76" font-weight="800">B</text>
  <circle cx="291" cy="209" r="5" fill="#8d9cff" />
  <circle cx="188" cy="306" r="3.5" fill="#57e2d1" />
  <text x="60" y="394" class="sans bright" font-size="52" font-weight="750" letter-spacing="-1.8">Bayad</text>
  <text x="62" y="428" class="sans muted" font-size="18" font-weight="550">Software Engineering Student</text>
  <path d="M60 454H424" stroke="#40516a" stroke-opacity="0.72" />
  <text x="60" y="487" class="muted label" font-size="11">ABOUT ME</text>
  <text x="60" y="519" class="sans bright" font-size="20" font-weight="650">The future</text>
  <text x="60" y="550" class="muted" font-size="14">~/profile $</text>
  <rect x="154" y="537" width="9" height="16" rx="1" fill="#72e5d6">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
  </rect>

  <text x="510" y="124" class="accent-text label">PROFILE</text>
  <text x="510" y="190" class="sans bright" font-size="36" font-weight="720" letter-spacing="-1.1"></text>
  <text x="510" y="232" class="sans bright" font-size="36" font-weight="720" letter-spacing="-1.1"></text>

  <text x="512" y="260" class="muted label" font-size="11">NAME</text>
  <text x="676" y="260" class="bright value">Bayad</text>
  <path d="M510 279H1114" stroke="#40516a" stroke-opacity="0.48" />
  <text x="512" y="330" class="muted label" font-size="11">STUDY</text>
  <text x="676" y="330" class="bright value">Software Engineering</text>
  <path d="M510 349H1114" stroke="#40516a" stroke-opacity="0.48" />
  <text x="512" y="400" class="muted label" font-size="11">ABOUT</text>
  <text x="676" y="400" class="bright value">The future</text>


  </g>

  <g class="mobile">
    <rect x="32" y="84" width="1116" height="492" rx="20" fill="url(#panel)" stroke="#31445b" />
    <text x="70" y="143" class="accent-text label" font-size="20">PROFILE / BAYAD</text>
    <text x="70" y="244" class="sans bright" font-size="82" font-weight="750" letter-spacing="-2">Bayad</text>
    <text x="72" y="303" class="sans muted" font-size="42" font-weight="600">Software Engineering Student</text>
    <path d="M70 332H900" stroke="#40516a" stroke-opacity="0.72" />
    <text x="72" y="376" class="accent-text label" font-size="18">ABOUT ME</text>
    <text x="70" y="424" class="sans bright" font-size="42" font-weight="650">The future</text>
    <circle cx="1000" cy="293" r="104" fill="#12243a" stroke="url(#accent)" stroke-width="3" />
    <circle cx="1000" cy="293" r="87" fill="none" stroke="#84a0bd" stroke-opacity="0.28" stroke-dasharray="3 10" />
    <text x="1000" y="330" text-anchor="middle" class="sans accent-text" font-size="106" font-weight="800">B</text>
    <circle cx="1074" cy="220" r="7" fill="#8d9cff" />
    <circle cx="925" cy="363" r="5" fill="#57e2d1" />
  </g>

  <rect x="20" y="83" width="1140" height="2" fill="url(#accent)" opacity="0.1">
    <animate attributeName="y" values="84;572;84" dur="24s" repeatCount="indefinite" />
  </rect>
</svg>
